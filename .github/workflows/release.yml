name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./... && go test ./...

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: build
        run: |
          set -e
          V=${GITHUB_REF_NAME}
          mkdir -p dist
          build() { # os arch pkg name
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="-s -w" -o "dist/$4_${V}_$1_$2" $3
          }
          build linux  amd64 .                   sandboxd
          build linux  amd64 ./cmd/sandboxd-mcp  sandboxd-mcp
          build linux  arm64 ./cmd/sandboxd-mcp  sandboxd-mcp
          build darwin arm64 ./cmd/sandboxd-mcp  sandboxd-mcp
          build darwin amd64 ./cmd/sandboxd-mcp  sandboxd-mcp
          build linux  amd64 ./guest             agent
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
